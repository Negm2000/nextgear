[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nextgear"
version = "2.0.0"
description = "Predict the next event while an agent assembles a gear pipeline, measured against the Bayes-optimal oracle"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Karim Negm" }]
dependencies = ["numpy>=2.0", "torch>=2.4", "matplotlib>=3.8", "fonttools>=4.40"]

[project.scripts]
nextgear = "nextgear.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "W"]
