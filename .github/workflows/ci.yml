name: checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      MPLBACKEND: Agg
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU dependencies and pinned Studio
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . build ruff "constructor-studio @ git+https://github.com/constructorfabric/studio.git@3e73a118af4108fa45b306e02f20c9692d1bc1d6"
      - name: Lint
        run: python -m ruff check src tests
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Small end-to-end run
        run: python -m nextgear --threads 2 --config configs/quick.toml --data-dir runs/ci/data --models-dir runs/ci/models --results-dir runs/ci/results all
      - name: Validate artifacts and code traceability
        run: cfs validate
      - name: Build wheel and source distribution
        run: python -m build
  registry-crosscheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the Rust toolchain gears-rust pins
        run: rustup toolchain install 1.98.1 --profile minimal && rustup default 1.98.1
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/registry_check/target
          key: registry-check-${{ hashFiles('tools/registry_check/Cargo.lock') }}
      - name: Build the harness against the pinned gears-rust toolkit
        run: cargo build --release --locked --manifest-path tools/registry_check/Cargo.toml
      - name: Compare Nextgear's dependency check with the real registry
        run: python tools/crosscheck_registry.py
      - name: Re-extract the declared dependencies and check they have not drifted
        run: |
          git init -q "$RUNNER_TEMP/gears-rust"
          git -C "$RUNNER_TEMP/gears-rust" fetch -q --depth 1 https://github.com/constructorfabric/gears-rust fc765feb8e328ae31c44bfb3a0c981b42e32a105
          git -C "$RUNNER_TEMP/gears-rust" checkout -q FETCH_HEAD
          python tools/extract_gears.py "$RUNNER_TEMP/gears-rust"
          git diff --exit-code src/nextgear/fabric_gears.py
