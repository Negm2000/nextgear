<text x="140.0" y="176.0" class="lbl" text-anchor="end">GRU, trained on it</text>
<path d="M150.0,164.0 H612.8 Q616.8,164.0 616.8,168.0 V176.0 Q616.8,180.0 612.8,180.0 H150.0 Z" fill="var(--seen)"/>
