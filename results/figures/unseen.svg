<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 780 426" role="img">
<title>System-check accuracy on combinations left out of training</title>
<style>
svg { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; --ink: #1f2328; --muted: #59636e; --grid: #d1d9e0; --ngram: #8c959f;
       --counts: #c4cbd3; --gru: #2a78d6; --seen: #a8c8ef; }
@media (prefers-color-scheme: dark) {
  svg { --ink: #f0f6fc; --muted: #9198a1; --grid: #3d444d; --ngram: #6e7681; --counts: #454c54;
         --gru: #3987e5; --seen: #24466f; }
}
.title { font-size: 15px; font-weight: 600; fill: var(--ink) }
.sub { font-size: 12px; fill: var(--muted) }
.head { font-size: 13px; font-weight: 600; fill: var(--ink) }
.lbl { font-size: 12px; fill: var(--ink) }
.val { font-size: 12px; fill: var(--ink); font-variant-numeric: tabular-nums }
.tick { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums }
.grid { stroke: var(--grid); stroke-width: 1 }
.range { stroke: var(--ink); stroke-width: 1.5 }
</style>
<text x="0.0" y="20.0" class="title" text-anchor="start">System checks on a combination the GRU never trained on</text>
<text x="0.0" y="40.0" class="sub" text-anchor="start">Share of pass/fail verdicts predicted correctly on new sessions of each combination left out of training.</text>
<text x="0.0" y="56.0" class="sub" text-anchor="start">Bars: average of three training seeds. Lines: lowest to highest seed.</text>
<text x="0.0" y="103.0" class="head" text-anchor="start">Chat Engine + Policy Manager + License Resolver</text>
