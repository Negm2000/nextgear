# Reference benchmark. Every number in results/ comes from this file.

[data]
train = 8000
validation = 1000
test = 2000
shifted = 1000
holdout = 600

# Each split draws from its own random stream. The same event trace can still occur in more than one split.
[seeds]
train = 1
validation = 2
test = 3
shifted = 4
holdout = 5
bootstrap = 6

# How specifications are drawn and how the agent behaves (assumptions, not measurements).
[priors]
execution_weights = [0.3333333333333333, 0.3333333333333333, 0.3333333333333334]
p_policy = 0.5
p_license = 0.5
p_usage = 0.5
p_tight_budget = 0.35
p_careful = 0.5
mistake_careful = 0.05
mistake_sloppy = 0.25
knows_outbound_careful = 0.9
knows_outbound_sloppy = 0.3
knows_deps_careful = 0.9
knows_deps_sloppy = 0.3
max_proposals = 60
max_submissions = 5

# The shifted test split: a different mix of specifications and a sloppier agent.
[shift]
execution_weights = [0.6, 0.2, 0.2]
p_tight_budget = 0.6
p_careful = 0.2
mistake_careful = 0.15
mistake_sloppy = 0.45
knows_outbound_careful = 0.6
knows_outbound_sloppy = 0.1
knows_deps_careful = 0.6
knows_deps_sloppy = 0.1

# Chosen on validation data while developing the earlier, hand-written version of the simulator, and
# kept unchanged when its rules were replaced by the declared gears-rust dependencies.
[model]
embedding = 32
hidden = 128
learning_rate = 0.003
batch_size = 64
max_epochs = 40
patience = 4
seeds = [0, 1, 2]

# The repeated exclusion test. Each group is one execution gear with two optional requirements, so
# together the three cover every execution gear and every pair once. The first is the group in
# section 6 of the report. Each group is removed from training and validation in turn.
[holdout]
groups = [["CHAT_ENGINE", "policy", "license"], ["BILLING_LEDGER", "policy", "usage"], ["SERVERLESS_RUNTIME", "license", "usage"]]
seeds = [0, 1, 2]

[baselines]
contexts = [1, 3, 6]

[evaluation]
bootstrap_resamples = 10000
what_if_sessions = 400
calibration_bins = 15
