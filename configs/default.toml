# Reference benchmark. Every number in results/ comes from this file.

[data]
train = 8000
validation = 1000
test = 2000
shifted = 1000
holdout = 600

# Independent random streams per split. Identical event traces can still recur.
[seeds]
train = 1
validation = 2
test = 3
shifted = 4
holdout = 5
bootstrap = 6

# How specifications are drawn and how the agent behaves (assumptions, not measurements).
[priors]
execution_weights = [0.3333333333333333, 0.3333333333333333, 0.3333333333333334]
p_policy = 0.5
p_license = 0.5
p_tenant = 0.5
p_usage = 0.5
p_tight_budget = 0.35
p_careful = 0.5
mistake_careful = 0.05
mistake_sloppy = 0.25
knows_outbound_careful = 0.9
knows_outbound_sloppy = 0.3
max_proposals = 40
max_submissions = 4

# The shifted test split: a different mix of specifications and a sloppier agent.
[shift]
execution_weights = [0.6, 0.2, 0.2]
p_tight_budget = 0.6
p_careful = 0.2
mistake_careful = 0.15
mistake_sloppy = 0.45
knows_outbound_careful = 0.6
knows_outbound_sloppy = 0.1

# Chosen on validation data during development.
[model]
embedding = 32
hidden = 128
learning_rate = 0.003
batch_size = 64
max_epochs = 40
patience = 4
seeds = [0, 1, 2]

[baselines]
contexts = [1, 3, 6]

[evaluation]
bootstrap_resamples = 10000
what_if_sessions = 400
calibration_bins = 15
